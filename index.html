function b64ToUint8(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}
let NODES = JSON.parse(pako.ungzip(b64ToUint8(NODES_B64), {to:'string'}));
const castEl = document.getElementById('cast');
const speakerEl = document.getElementById('speaker');
const lineEl = document.getElementById('line');
const choicesEl = document.getElementById('choices');
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
function showCast() {
  const people = [['Riley','#7ec8e3'],['Sam','#f0a7a0'],['Alex','#f5d76e'],['Jordan','#a8e6a1']];
  castEl.innerHTML = people.map(([n,c]) => '<div class="spr" style="background:'+c+'">'+n+'</div>').join('');
}
function go(id) {
  const n = NODES[id];
  if (!n) { lineEl.textContent = 'Missing node '+id; return; }
  if (n.type === 'goto') return go(n.to);
  choicesEl.innerHTML = '';
  if (n.type === 'end') { speakerEl.textContent = ''; lineEl.textContent = n.text; return; }
  if (n.type === 'choice') {
    speakerEl.textContent = '';
    lineEl.textContent = n.prompt || '';
    n.options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.text;
      b.onclick = () => go(o.to);
      choicesEl.appendChild(b);
    });
    return;
  }
  showCast();
  const sp = n.speaker || '';
  speakerEl.style.color = COLORS[sp] || '#eee';
  speakerEl.textContent = sp;
  lineEl.textContent = n.text;
  const cont = document.createElement('button');
  cont.textContent = 'Continue';
  cont.onclick = () => go(n.next);
  choicesEl.appendChild(cont);
}
document.getElementById('btnLease').onclick = () => {
  panelBody.innerHTML = '<h3>LEASE</h3><p>Settling week. Lit 101 + Beacon opening on the calendar.</p>';
  panel.showModal();
};
document.getElementById('btnNapkin').onclick = () => {
  panelBody.innerHTML = '<h3>HOUSE CLAUSE</h3><ol><li>No dating roommates</li><li>Quiet hours 11–7</li><li>Chores rotate</li><li>Rent before the 5th</li><li>Break → meet within 48h</li></ol>';
  panel.showModal();
};
document.getElementById('btnCal').onclick = () => {
  panelBody.innerHTML = '<h3>CALENDAR</h3><p>Week 2 — Settling</p><p>Mon/Wed AM — Holloway Lit 101</p><p>Tue — Beacon Café opening</p>';
  panel.showModal();
};
